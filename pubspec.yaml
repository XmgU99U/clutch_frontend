name: clutch
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  dartz: ^0.10.1
  lottie: ^3.5.1
  flutter_otp_text_field: ^1.5.1+1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Barlow_Condensed/BarlowCondensed-Black.ttf
          weight: 900

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_24pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_24pt-Bold.ttf
          weight: 700

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrains_Mono/JetBrainsMono-Medium.ttf
          weight: 500